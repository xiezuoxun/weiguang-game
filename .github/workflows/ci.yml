# 《微光归处》CI 工作流
# 触发：push / PR 到 main、master 或 phase5* 分支时，跑层 0（契约门 + 自测 + 命名守护）+ 层 1（Unity EditMode）。
# 层 1（Unity EditMode / G4/G5/G7）已启用，依赖仓库 Secrets 中的 UNITY_LICENSE（个人版免费 license .ulf 内容）。
# 未配置该 secret 时 unity-tests job 会失败——属预期，需在 GitHub 仓库 Settings → Secrets → Actions 配置。
name: CI

on:
  push:
    branches: [main, master, "phase5*"]
  pull_request:
    branches: [main, master]

jobs:
  contract-gate:
    name: 层0 契约门 (I1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: G1 契约门
        run: python tools/validate_contract.py Assets/Data

      - name: G2 契约校验器自测
        run: python tools/test_validate_contract.py

      - name: G3 命名与阈值守护
        run: python tools/check_naming.py Assets/Scripts

      - name: G3 测试布局守护
        run: python tools/check_test_layout.py

      - name: Upload artifacts (如有 Unity 产物)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: artifacts/
          if-no-files-found: ignore

  # =============================================================================
  # 层 1 · Unity EditMode 测试门（G4/G5/G7）—— 个人版免费激活（已启用）
  # -----------------------------------------------------------------------------
  # 前置（需在 GitHub 仓库侧完成，本机无法代劳）：
  #   1. 仓库 Secrets（Settings → Secrets → Actions）配置 `UNITY_LICENSE`：
  #        个人版免费 license 的 .ulf 内容（整段 XML 文本）。
  #        Windows:  C:\ProgramData\Unity\Unity_lic.ulf
  #        Mac:      /Library/Application Support/Unity/Unity_lic.ulf
  #        Linux:    ~/.local/share/unity3d/Unity/Unity_lic.ulf
  #   2. 未配置该 secret 时本 job 会失败——属 license 缺失而非代码问题。
  #   说明：个人版免费激活无需 serial；game-ci/unity-test-runner 会自动用
  #        UNITY_LICENSE 激活容器内环境。
  # =============================================================================
  unity-tests:
    name: 层1 Unity EditMode 测试 (G4/G5/G7)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Check UNITY_LICENSE secret
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "ERROR: UNITY_LICENSE secret is empty or not set"
            exit 1
          else
            echo "UNITY_LICENSE is set (length: ${#UNITY_LICENSE})"
            echo "First 50 chars: ${UNITY_LICENSE:0:50}"
          fi

      - name: Run EditMode Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2022.3.20f1
          testMode: editmode
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EditMode Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EditMode-results
          path: artifacts
          if-no-files-found: ignore
