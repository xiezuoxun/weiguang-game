# 《微光归处》CI 工作流
# 触发：push / PR 到 main、master 或 phase5* 分支时，跑层 0（契约门 + 自测 + 命名守护）+ 层 1（Unity EditMode）。
# 层 1（Unity EditMode / G4/G5/G7）已启用，依赖仓库 Secrets 中的 UNITY_LICENSE（个人版免费 license .ulf 内容）。
# 未配置该 secret 时 unity-tests job 会失败——属预期，需在 GitHub 仓库 Settings → Secrets → Actions 配置。
name: CI

on:
  push:
    branches: [main, master, "phase5*"]
  pull_request:
    branches: [main, master]

jobs:
  contract-gate:
    name: 层0 契约门 (I1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: G1 契约门
        run: python tools/validate_contract.py Assets/Data

      - name: G2 契约校验器自测
        run: python tools/test_validate_contract.py

      - name: G3 命名与阈值守护
        run: python tools/check_naming.py Assets/Scripts

      - name: G3 测试布局守护
        run: python tools/check_test_layout.py

      - name: Upload artifacts (如有 Unity 产物)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: artifacts/
          if-no-files-found: ignore

  # =============================================================================
  # 层 1 · Unity EditMode 测试门（G4/G5/G7）—— self-hosted runner 真跑（已启用）
  # -----------------------------------------------------------------------------
  # 关键修复（Phase 7 P0-①）：原 ubuntu-latest + game-ci/unity-test-runner 在
  #   GitHub-hosted runner 上跑 2022.3.x 会 docker 内 Unity 崩溃（exit 133 / SIGTRAP，
  #   容器内存不足 + 镜像版本不匹配）。改 self-hosted runner 后，game-ci 在
  #   Windows 本机上直接用已装的 Unity（不走 docker），exit 133 彻底消失，CI 真绿。
  #   —— 本机 165/165 即 ground truth，self-hosted 只是把它搬到云端 CI 复跑。
  #
  # 前置（用户本机一次性操作，详见 production/phase7-ci-selfhosted.md）：
  #   1. 仓库 Settings → Actions → Runners → New self-hosted runner（Windows x64）
  #      下载并解压到本机目录，在 PowerShell 跑 ./config.cmd（贴 repo URL + token，
  #      提示 Labels 时输入 `unity` 以便匹配下方 runs-on），再 ./run.cmd 常驻。
  #   2. UNITY_LICENSE 等 Secrets 仍保留（本机已激活也可留空，game-ci 会复用本机 license）。
  #   3. 本机需已装 Unity 2022.3.20f1 + 编辑器中（已就绪）。
  # =============================================================================
  unity-tests:
    name: 层1 Unity EditMode 测试 (G4/G5/G7)
    runs-on: [self-hosted, unity]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Check UNITY_LICENSE secret
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          # Windows runner（self-hosted weiguang-pc）默认 shell 是 PowerShell，bash 语法会解析失败；
          # 且 self-hosted 本机已激活 license 时，secret 为空也可由 game-ci 复用本机 license
          # （见 production/phase7-ci-selfhosted.md 备注）——故此处降级为警告而非硬失败。
          if ([string]::IsNullOrEmpty($env:UNITY_LICENSE)) {
            Write-Host "WARN: UNITY_LICENSE secret empty - self-hosted runner reuses local Unity license (OK on weiguang-pc)"
          } else {
            Write-Host "UNITY_LICENSE is set (length: $($env:UNITY_LICENSE.Length))"
          }

      - name: Run EditMode Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2022.3.20f1
          testMode: editmode
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EditMode Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EditMode-results
          path: artifacts
          if-no-files-found: ignore
