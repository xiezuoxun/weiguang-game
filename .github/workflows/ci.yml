# 《微光归处》CI 工作流
# 触发：push / PR 到 main、master 或 phase5* 分支时，跑层 0（契约门 + 自测 + 命名守护）+ 层 1（Unity EditMode）。
# 层 1（Unity EditMode / G4/G5/G7）已启用，依赖仓库 Secrets 中的 UNITY_LICENSE（个人版免费 license .ulf 内容）。
# 未配置该 secret 时 unity-tests job 会失败——属预期，需在 GitHub 仓库 Settings → Secrets → Actions 配置。
name: CI

on:
  push:
    branches: [main, master, "phase5*"]
  pull_request:
    branches: [main, master]

jobs:
  contract-gate:
    name: 层0 契约门 (I1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: G1 契约门
        run: python tools/validate_contract.py Assets/Data

      - name: G2 契约校验器自测
        run: python tools/test_validate_contract.py

      - name: G3 命名与阈值守护
        run: python tools/check_naming.py Assets/Scripts

      - name: G3 测试布局守护
        run: python tools/check_test_layout.py

      - name: Upload artifacts (如有 Unity 产物)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: artifacts/
          if-no-files-found: ignore

  # =============================================================================
  # 层 1 · Unity EditMode 测试门（G4/G5/G7）—— self-hosted runner 真跑（已启用）
  # -----------------------------------------------------------------------------
  # 关键修复（Phase 7 P0-①→③）：原 ubuntu-latest + game-ci/unity-test-runner 在
  #   GitHub-hosted runner 上 docker 内 Unity 崩溃（exit 133 / SIGTRAP）。
  #   改 self-hosted 后仍红：game-ci 系列是 docker action，本机未装 docker →
  #   "Unable to locate executable file: docker"。
  #   最终方案：不依赖 docker/game-ci，直接调用本机已装的 Unity.exe 批处理跑
  #   EditMode（与本地手动命令一致）——本机 165/165 即 ground truth，CI 复跑同一条命令。
  #
  # 前置（用户本机一次性操作，详见 production/phase7-ci-selfhosted.md）：
  #   1. 仓库 Settings → Actions → Runners → New self-hosted runner（Windows x64）
  #      下载并解压到本机目录，在 PowerShell 跑 ./config.cmd（贴 repo URL + token，
  #      提示 Labels 时输入 `unity` 以便匹配下方 runs-on），再 ./run.cmd 常驻。
  #   2. runner 侧 PowerShell 执行策略须为 RemoteSigned（CurrentUser scope；
  #      PS 5.1 默认 Restricted 会拒绝加载 runner 生成的 .ps1，所有 run: 步骤 exit 1）。
  #   3. 本机需已装 Unity 2022.3.20f1 且已激活 license（Unity.exe 直接复用，无需 secrets）。
  # =============================================================================
  unity-tests:
    name: 层1 Unity EditMode 测试 (G4/G5/G7)
    runs-on: [self-hosted, unity]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Check UNITY_LICENSE secret
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          # Windows runner default shell is PowerShell; keep this block ASCII-only
          # (PS 5.1 reads UTF-8 no-BOM scripts as ANSI, CJK comments break parsing).
          # Self-hosted weiguang-pc has a local activated license, so an empty
          # secret is OK: game-ci reuses the local license (phase7-ci-selfhosted.md).
          if ([string]::IsNullOrEmpty($env:UNITY_LICENSE)) {
            Write-Host "WARN: UNITY_LICENSE secret empty - self-hosted runner reuses local Unity license"
          } else {
            Write-Host "UNITY_LICENSE is set"
          }

      - name: Run EditMode Tests
        run: |
          # Self-hosted Windows runner hosts Unity 2022.3.20f1 locally.
          # game-ci/unity-test-runner is a docker action (docker not installed
          # on this machine), so invoke the local Unity Editor directly.
          # Exit codes: 0 = all tests passed, 2 = test failures, other = error.
          $unity = 'C:\Program Files\Unity\Hub\Editor\2022.3.20f1\Editor\Unity.exe'
          if (-not (Test-Path -LiteralPath $unity)) {
            Write-Host "::error::Unity editor not found at $unity"
            exit 3
          }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifacts" | Out-Null
          & $unity -batchmode -nographics `
            -projectPath "$env:GITHUB_WORKSPACE" `
            -runTests -testPlatform EditMode `
            -testResults "$env:GITHUB_WORKSPACE\artifacts\editmode.xml" `
            -logFile "$env:GITHUB_WORKSPACE\artifacts\unity-editmode.log"
          $code = $LASTEXITCODE
          if (Test-Path "$env:GITHUB_WORKSPACE\artifacts\editmode.xml") {
            [xml]$r = Get-Content "$env:GITHUB_WORKSPACE\artifacts\editmode.xml" -Raw
            Write-Host ("EditMode total=" + $r.'test-run'.total + " passed=" + $r.'test-run'.passed + " failed=" + $r.'test-run'.failed)
          }
          exit $code

      - name: Upload EditMode Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EditMode-results
          path: artifacts
          if-no-files-found: ignore
